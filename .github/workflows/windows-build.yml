name: Captovix Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test package integrity verifier
        run: python scripts/Test-CI-Packages.py
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build, test and package
        shell: pwsh
        env:
          CAPTOVIX_UPDATE_URL: ${{ vars.CAPTOVIX_UPDATE_URL }}
          CAPTOVIX_UPDATE_KIND: ${{ vars.CAPTOVIX_UPDATE_KIND }}
        run: |
          $kind = if ($env:CAPTOVIX_UPDATE_KIND) { $env:CAPTOVIX_UPDATE_KIND } else { 'GitHub' }
          $buildArgs = @{ TestProfile='CI'; UpdateKind=$kind }
          if ($env:CAPTOVIX_UPDATE_URL) { $buildArgs.UpdateSource = $env:CAPTOVIX_UPDATE_URL }
          ./scripts/Build-Windows.ps1 @buildArgs
      - name: Upload build artifacts (does not publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: Captovix-Windows-x64
          path: |
            artifacts/Captovix-*.exe
            artifacts/Captovix-v*-Update-Packages.zip
            artifacts/ci-test-report.json
            artifacts/package-verification.json
            artifacts/Captovix V* — *.zip
          if-no-files-found: error
      - name: Upload diagnostics even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Captovix-build-diagnostics
          path: |
            artifacts/ci-test-report.json
            artifacts/package-verification.json
          if-no-files-found: ignore
