name: Captovix Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build, test and package
        shell: pwsh
        env:
          CAPTOVIX_UPDATE_URL: ${{ vars.CAPTOVIX_UPDATE_URL }}
          CAPTOVIX_UPDATE_KIND: ${{ vars.CAPTOVIX_UPDATE_KIND }}
        run: |
          $kind = if ($env:CAPTOVIX_UPDATE_KIND) { $env:CAPTOVIX_UPDATE_KIND } else { 'GitHub' }
          ./scripts/Build-Windows.ps1 -UpdateSource $env:CAPTOVIX_UPDATE_URL -UpdateKind $kind
      - name: Upload build artifacts (does not publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: Captovix-Windows-x64
          path: |
            artifacts/Captovix-*.exe
            artifacts/Captovix-*.zip
