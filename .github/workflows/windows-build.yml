name: Windows x64 build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and package
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -SkipInstaller
      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Capture-Foundation-v0.1.0-Windows-x64
          path: artifacts/Capture-Foundation-v0.1.0-Portable-Windows-x64.zip
