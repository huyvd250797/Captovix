name: Build configured Captovix Windows packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check serverless handler
        run: |
          npm ci
          npm run check
          npm test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Embed PUBLIC license configuration
        shell: pwsh
        env:
          LICENSE_API_URL: ${{ vars.CAPTOVIX_LICENSE_API_URL }}
          LICENSE_PUBLIC_PEM: ${{ vars.CAPTOVIX_LICENSE_PUBLIC_KEY_PEM }}
          LICENSE_ISSUER: ${{ vars.CAPTOVIX_LICENSE_ISSUER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LICENSE_API_URL -or -not $env:LICENSE_PUBLIC_PEM) { throw 'Set public repository variables for API URL/public key. Never supply the signing private key.' }
          $issuer = if ($env:LICENSE_ISSUER) { $env:LICENSE_ISSUER } else { 'captovix-production' }
          @{apiUrl=$env:LICENSE_API_URL;issuer=$issuer;publicKeyPem=$env:LICENSE_PUBLIC_PEM} | ConvertTo-Json | Set-Content src/Captovix/license-config.json -Encoding utf8
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build, check and package
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - name: Upload packages for review (no automatic Release)
        uses: actions/upload-artifact@v4
        with:
          name: Captovix-Windows-configured
          path: |
            artifacts/Captovix-v*-Update-Packages.zip
            artifacts/Captovix-v*-Source.zip
          if-no-files-found: error
