<!doctype html><html lang="vi"><meta charset="utf-8"><title>Captovix V1.14 · Trang kiểm thử chụp cuộn</title><style>body{margin:0;background:#e7eaf2;font:17px/1.6 system-ui;color:#202638}main{max-width:820px;margin:24px auto;padding:32px;background:white}article{padding:18px;border-bottom:1px solid #aaa}h1{color:#7c3aed}b{display:inline-block;width:90px}em{color:#526079}canvas{width:100%;height:120px}</style><main><h1>Captovix · Mẫu cuộn dọc SDR</h1><p>Chọn vùng nội dung, không chọn chrome/scrollbar. Giữ nguyên zoom. Kiểm tra hàng đánh số không mất hoặc lặp tại từng điểm nối.</p><div id="rows"></div></main><script>const host=document.getElementById('rows');for(let i=1;i<=100;i++){let row=document.createElement('article');row.innerHTML=`<b>Hàng ${String(i).padStart(3,'0')}</b> Nội dung kiểm tra đường nối — Captovix ${i*7919}.<br><em>Mẫu ${i%7}: chữ, số 0123456789 và đường viền liên tục.</em>`;if(i%8===0){let c=document.createElement('canvas');c.width=750;c.height=120;let ctx=c.getContext('2d');for(let x=0;x<750;x+=10){ctx.fillStyle=`hsl(${(x*3+i*17)%360} 70% 50%)`;ctx.fillRect(x,0,10,120)}row.append(c)}host.append(row)}</script></html>
