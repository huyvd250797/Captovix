<!doctype html><html lang="vi"><meta charset="utf-8"><title>Captovix · Bảng thử ghép ngang</title><style>body{font:16px system-ui;margin:0}table{border-collapse:collapse;width:6000px;table-layout:fixed}td,th{border:1px solid #999;padding:12px;width:120px}th{background:#ddd2ff}tr:nth-child(even){background:#edf5ff}</style><p>Chọn vùng bảng; cuộn ngang và kiểm tra số cột liên tục tại mỗi điểm nối. Mẫu này cần nghiệm thu trên Windows.</p><table id="grid"></table><script>let s='<tr>';for(let c=1;c<=40;c++)s+='<th>Cột '+c+'</th>';s+='</tr>';for(let r=1;r<=12;r++){s+='<tr>';for(let c=1;c<=40;c++)s+='<td>H'+r+' / C'+c+' · '+(r*101+c)+'</td>';s+='</tr>'}document.getElementById('grid').innerHTML=s;</script></html>
