<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captovix · Pixel / Freeze Test</title><style>html,body{margin:0;overflow:hidden;background:#111827}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:20px;bottom:20px;background:#111827ee;color:#fff;font:14px system-ui;padding:12px 16px;border-radius:8px;max-width:540px}button{font:inherit;padding:6px 12px;margin:6px;color:#fff;background:#6e47d9;border:0;border-radius:5px}</style><canvas id="board"></canvas><aside>Test local, không gửi dữ liệu. Ctrl+0 đưa browser về zoom100%, có thể F11.<br>Hotkey Captovix → chờ5giây ở selector → Enter. Đồng hồ trên ảnh giữ nguyên lúc bắt đầu; các vạch1px không bị trộn ở chế độ100%.<br><button id="banner">Sau3giây đổi nội dung / hiện banner</button><span id="info"></span></aside><script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let banner=false;
function draw(){const scale=window.devicePixelRatio||1,w=Math.round(innerWidth*scale),h=Math.round(innerHeight*scale);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,w,h);for(let x=0;x<w;x++){ctx.fillStyle=x%2?'#ffffff':'#000000';ctx.fillRect(x,0,1,60)}for(let y=70;y<150;y++){ctx.fillStyle=y%2?'#ffffff':'#000000';ctx.fillRect(0,y,w,1)}for(let y=170;y<h;y+=32)for(let x=0;x<w;x+=32){ctx.fillStyle=(x/32+y/32)%2<1?'#3466ff':'#e2e8f0';ctx.fillRect(x,y,32,32)}ctx.fillStyle='#111827';ctx.fillRect(20,170,Math.min(w-40,900),150);ctx.fillStyle='white';ctx.font='bold 34px monospace';ctx.fillText(new Date().toLocaleTimeString('vi-VN')+'.'+String(new Date().getMilliseconds()).padStart(3,'0'),40,225);ctx.font='20px monospace';ctx.fillText('Backing pixels '+w+' × '+h+' · DPR '+scale,40,270);if(banner){ctx.fillStyle='#b42318';ctx.fillRect(20,340,Math.min(w-40,900),100);ctx.fillStyle='white';ctx.fillText('Nội dung xuất hiện SAU snapshot phải vắng khỏi PNG.',40,398)}document.getElementById('info').textContent='DPR '+scale}
document.getElementById('banner').onclick=()=>{banner=false;setTimeout(()=>{banner=true;draw()},3000)};setInterval(draw,100);draw();
</script></html>
